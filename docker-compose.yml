services:
  postgres:
    image: postgres:16-alpine
    container_name: secure-browser-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-secure_browser}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-secure_browser}"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - secure-browser-db

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: secure-browser-backend
    restart: unless-stopped
    environment:
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-secure_browser}}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      SESSION_NETWORK: "secure-browser-sessions"
      VNC_BIND_HOST: ${VNC_BIND_HOST:-}
      VNC_PROXY_HOST: ${VNC_PROXY_HOST:-}
      ENABLE_HOST_PORT_BINDINGS: ${ENABLE_HOST_PORT_BINDINGS:-true}
      BROWSER_IMAGE: "vnc-browser-chrome:latest"
      EGRESS_GUARD_REQUIRED: ${EGRESS_GUARD_REQUIRED:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - secure-browser-db
      - secure-browser-frontend

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: secure-browser-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:3001}
    depends_on:
      - backend
    networks:
      - secure-browser-frontend

  browser-image:
    build:
      context: docker/browser
      dockerfile: Dockerfile
    image: vnc-browser-chrome:latest
    profiles:
      - build-only

  firewall:
    build:
      context: .
      dockerfile: docker/firewall/Dockerfile
    container_name: secure-browser-firewall
    restart: unless-stopped
    labels:
      sb.egress-guard: "true"
    healthcheck:
      test: ["CMD-SHELL", "iptables -w -S SB-EGRESS 2>/dev/null | grep -q 169.254.0.0/16 && iptables -w -S SB-INPUT 2>/dev/null | grep -q -- "-j DROP""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    network_mode: host
    cap_add:
      - NET_ADMIN
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      SESSION_NETWORK: "secure-browser-sessions"

volumes:
  postgres_data:

networks:
  secure-browser-db:
    name: secure-browser-db
    driver: bridge
  secure-browser-frontend:
    name: secure-browser-frontend
    driver: bridge
  secure-browser-sessions:
    name: secure-browser-sessions
    driver: bridge
